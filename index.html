    <title>人生ガチャ</title>

    <style>

        /* =========================

           全体

        ========================= */

        * {

            box-sizing: border-box;

        }

        body {

            margin: 0;

            font-family:

                Arial,

                "Hiragino Kaku Gothic ProN",

                "Yu Gothic",

                sans-serif;

            background: #fff0f6;

            color: #5b4545;

        }

        /* =========================

           Header

        ========================= */

        header {

            text-align: center;

            padding: 35px 20px 25px;

        }

        header h1 {

            margin: 0 0 10px;

            font-size: 52px;

            color: #ef4f82;

            font-weight: bold;

        }

        header p {

            margin: 0;

            font-size: 20px;

            color: #5b4545;

        }

        /* =========================

           Main

        ========================= */

        main {

            width: 100%;

            max-width: 1450px;

            margin: 0 auto;

            padding: 20px 30px 50px;

        }

        /* =========================

           3 Columns

        ========================= */

        .main-area {

            display: grid;

            grid-template-columns:

                1fr 1fr 1fr;

            gap: 20px;

            align-items: stretch;

        }

        /* =========================

           Common Card

        ========================= */

        .character,

        .profile,

        .gacha-box {

            background: white;

            border-radius: 25px;

            box-shadow:

                0 5px 20px rgba(0, 0, 0, 0.07);

            overflow: hidden;

        }

        /* =========================

           Character

        ========================= */

        .character {

            text-align: center;

            padding: 25px 20px 30px;

        }

        .monkey {

            width: 100%;

            margin-bottom: 10px;

        }

        .monkey img {

            display: block;

            width: 100%;

            max-width: 450px;

            height: auto;

            margin: 0 auto;

            border-radius: 20px;

        }

        .character h2 {

            margin: 10px 0;

            font-size: 30px;

            color: #e9507a;

        }

        .character p {

            margin: 0;

            font-size: 18px;

            line-height: 1.8;

        }

        /* =========================
        Profile

        ========================= */

        .profile {

            padding: 20px;

        }

        .profile h2 {

            margin: 0 0 15px;

            padding: 14px 10px;

            background: #f45d8a;

            color: white;

            border-radius: 20px;

            text-align: center;

            font-size: 28px;

        }

        /* Profile Item */

        .profile-item {

            display: flex;

            align-items: flex-start;

            gap: 15px;

            padding: 12px 5px;

            border-bottom:

                1px solid #f5d8df;

        }

        .profile-item:last-child {

            border-bottom: none;

        }

        /* Profile Title */

        .profile-title {

            flex: 0 0 115px;

            padding: 9px 8px;

            background: #ffe0e8;

            color: #d94f70;

            border-radius: 18px;

            text-align: center;

            font-weight: bold;

            font-size: 16px;

        }

        /* Profile Text */

        .profile-text {

            flex: 1;

            padding-top: 5px;

            line-height: 1.6;

            font-size: 16px;

            word-break: keep-all;

        }

        /* =========================

           Gacha Box

        ========================= */

        .gacha-box {

            padding: 25px 20px 30px;

            text-align: center;

            display: flex;

            flex-direction: column;

            justify-content: flex-start;

            align-items: center;

        }

        /* =========================

           Gacha Machine

        ========================= */

        .gacha-machine {

            display: block;

            width: 100%;

            max-width: 400px;

            height: auto;

            margin: 0 auto 15px;

            border-radius: 20px;

            transform-origin: center;

        }

        /* =========================

           Gacha Animation

        ========================= */

        .gacha-machine.spinning {

            animation:

                gachaShake 0.12s infinite alternate;

        }

        @keyframes gachaShake {

            0% {

                transform:

                    rotate(-4deg)

                    scale(1);

            }

            50% {

                transform:

                    rotate(4deg)

                    scale(1.03);

            }

            100% {

                transform:

                    rotate(-4deg)

                    scale(1);

            }

        }

        /* =========================

           Gacha Button

        ========================= */

        .gacha-button {

            width: 90%;

            max-width: 380px;

            padding: 18px 20px;

            background: #f45d83;

            color: white;

            border: none;

            border-radius: 50px;

            font-size: 24px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:

                0 6px 0 #d9476b;

            transition:

                transform 0.2s,

                box-shadow 0.2s;

        }

        .gacha-button:hover {

            transform: translateY(3px);

            box-shadow:

                0 3px 0 #d9476b;

        }

        .gacha-button:active {

            transform: translateY(6px);

            box-shadow: none;

        }

        /* =========================
        Gacha Description

        ========================= */

        .gacha-text {

            margin: 20px 0 0;

            font-size: 18px;

            line-height: 1.7;

        }

        /* =========================

           Fortune Result

        ========================= */

        .result {

            width: 100%;

            margin-top: 25px;

            padding: 22px;

            background: #fff0f6;

            border:

                3px solid #f58aaa;

            border-radius: 20px;

            color: #e9507a;

            line-height: 1.7;

            text-align: left;

            min-height: 30px;

            display: none;

        }

        /* Result ပေါ်လာရင် */

        .result.show {

            display: block;

            animation:

                resultPop 0.6s ease;

        }

        @keyframes resultPop {

            0% {

                transform: scale(0.5);

                opacity: 0;

            }

            70% {

                transform: scale(1.05);

                opacity: 1;

            }

            100% {

                transform: scale(1);

                opacity: 1;

            }

        }

        /* Fortune Title */

        .fortune-title {

            text-align: center;

            font-size: 30px;

            font-weight: bold;

            margin-bottom: 15px;

            color: #e83f76;

        }

        /* Fortune Text */

        .fortune-text {

            font-size: 18px;

            color: #5b4545;

            margin-bottom: 15px;

        }

        /* Lucky Sign */

        .lucky-item {

            padding: 12px;

            margin-top: 10px;

            background: #ffe0e8;

            border-radius: 15px;

            color: #d94f70;

            font-size: 16px;

        }

        /* Today's Advice */

        .fortune-action {

            padding: 12px;

            margin-top: 10px;

            background: white;

            border-radius: 15px;

            color: #5b4545;

            font-size: 16px;

        }

        /* =========================

           Bottom Message

        ========================= */

        .message {

            margin-top: 25px;

            padding: 30px 20px;

            background: white;

            border:

                3px dashed #f5a4b9;

            border-radius: 25px;

            text-align: center;

        }

        .message p {

            margin: 5px 0 15px;

            font-size: 21px;

            line-height: 1.8;

        }

        .message span {

            color: #f05b82;

            font-weight: bold;

        }

        /* =========================

           Tablet / Mobile

        ========================= */

        @media (max-width: 900px) {

            .main-area {

                grid-template-columns: 1fr;

            }

            .character,

            .profile,

            .gacha-box {

                width: 100%;

            }

            header h1 {

                font-size: 42px;

            }

        }

        /* =========================

           Small Mobile

        ========================= */

        @media (max-width: 500px) {

            header {

                padding:

                    25px 15px 15px;

            }

            header h1 {

                font-size: 34px;

            }

            header p {

                font-size: 16px;

            }

            main {

                padding: 15px;

            }

            .profile-item {

                gap: 10px;

            }

            .profile-title {

                flex-basis: 90px;

                font-size: 14px;

            }

            .profile-text {

                font-size: 14px;

            }

            .character h2 {

                font-size: 26px;

            }

            .gacha-button {

                font-size: 20px;

            }

            .fortune-title {

                font-size: 25px;

            }

            .fortune-text {

                font-size: 16px;

            }

        }

    </style>
